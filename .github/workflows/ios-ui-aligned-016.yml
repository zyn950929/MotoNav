name: iOS 0.16 new app icon build12
on:
  push:
    branches: [codex/ios-016-new-icon-20261031]
    paths: ['ios/**', '.github/workflows/ios-ui-aligned-016.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: motonav-ios-new-icon-build12
  cancel-in-progress: true
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: pods
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ios-pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
      - name: Reuse previously verified public SDK cache
        if: steps.pods.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/LockedSDK" "$HOME/Library/Caches"
          if gh run download 41173836576 -R zyn950929/MotoNav -n ios-locked-pods-cache -D "$RUNNER_TEMP/LockedSDK"; then
            tar -xzf "$RUNNER_TEMP/LockedSDK/ios-locked-pods-cache.tar.gz" -C "$HOME/Library/Caches"
          else
            echo 'Verified cache unavailable; CocoaPods will download the locked SDK versions.'
          fi
      - name: Install locked dependencies
        timeout-minutes: 10
        working-directory: ios
        run: |
          sudo gem install cocoapods -v 1.16.2 --no-document
          pod _1.16.2_ install --deployment
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ios-pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
      - name: Build iPhone Release arm64
        run: |
          set -o pipefail
          xcodebuild -workspace ios/MotoNav.xcworkspace -scheme MotoNav -destination 'generic/platform=iOS' -configuration Release -derivedDataPath "$RUNNER_TEMP/Derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= build | tee build-ios.log
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Derived/Build/Products/Release-iphoneos/MotoNav.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" = '0.16.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" = '12'
          test -f "$APP/PlugIns/MotoNavShare.appex/MotoNavShare"
          mkdir -p output/ios "$RUNNER_TEMP/Stage/Payload"
          python3 - "$APP" <<'PY'
          import pathlib,plistlib,struct,sys,json,hashlib,shutil
          app=pathlib.Path(sys.argv[1])
          src=pathlib.Path('ios/MotoNav/Assets.xcassets/AppIcon.appiconset/icon.png')
          raw=src.read_bytes()
          assert struct.unpack('>II',raw[16:24])==(1024,1024) and raw[25]==2
          info=plistlib.loads((app/'Info.plist').read_bytes())
          primary=info['CFBundleIcons']['CFBundlePrimaryIcon']
          assert primary['CFBundleIconName']=='AppIcon'
          icons=list(app.glob('AppIcon*.png'))
          assert icons
          record={'sourceSHA256':hashlib.sha256(raw).hexdigest(),'sourceSize':[1024,1024],'opaqueRGB':True,'compiledIconFiles':[p.name for p in icons],'bundleVersion':info['CFBundleVersion']}
          pathlib.Path('output/ios/icon-verification.json').write_text(json.dumps(record,indent=2))
          shutil.copy2(src,'output/ios/icon-preview.png')
          shutil.copy2(max(icons,key=lambda p:p.stat().st_size),'output/ios/icon-compiled.png')
          print('PASS 1024x1024 opaque icon and compiled AppIcon bundle entries')
          PY
          ditto "$APP" "$RUNNER_TEMP/Stage/Payload/MotoNav.app"
          xcrun strip -S "$RUNNER_TEMP/Stage/Payload/MotoNav.app/MotoNav"
          xcrun strip -S "$RUNNER_TEMP/Stage/Payload/MotoNav.app/PlugIns/MotoNavShare.appex/MotoNavShare"
          (cd "$RUNNER_TEMP/Stage" && zip -qry "$GITHUB_WORKSPACE/output/ios/MotoNav-0.16.0-new-icon-build12-unsigned.ipa" Payload)
          (cd output/ios && shasum -a 256 *.ipa > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MotoNav-iOS-0.16.0-NewIcon-Build12
          path: |
            output/ios/
            build-ios.log
          if-no-files-found: warn

