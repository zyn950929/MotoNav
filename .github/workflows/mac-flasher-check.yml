name: macOS flasher smoke check
on:
  push:
    branches: [codex/ios-parity-016-20261031]
    paths: ['mac-flasher/**', '.github/workflows/mac-flasher-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check native tool and launcher without flashing
        run: python3 mac-flasher/smoke.py | tee mac-flasher-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MotoNav-macOS-flasher-validation-${{ matrix.runner }}
          path: mac-flasher-check.log
